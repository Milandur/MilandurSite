<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Загрузка...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Анимированное кольцо */
    .spinner {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 20%, #ffffff, #ffffff);
      animation: spin 1.2s linear infinite;
      /* Сглаживание краев маской */
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #fff 0);
      mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #fff 0);
    }

    /* Мягкое свечение сзади */
    .spinner::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      filter: blur(12px);
      opacity: 0.6;
    }

    /* Текст с пульсацией */
    .loading-text {
      color: #f8fafc;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.8s ease-in-out infinite;
    }

    /* Анимация вращения */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Анимация прозрачности текста */
    @keyframes pulse {
      0%, 100% {
        opacity: 0.4;
      }
      50% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="spinner"></div>
    <div class="loading-text">Загрузка...</div>
  </div>

</body>
</html>
